# Production stack. Local dev stays on compose.yaml — do not merge profiles blindly.
#
# Usage:
#   cp .env.prod.example .env.prod   # fill secrets on the server only
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
#
# [HUMANO] TLS: see docker/Caddyfile.example and docs/runbooks/proxy-https.md

name: camila-prod

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    restart: unless-stopped
    # No host port binding — reachable only on the internal network as `postgres:5432`.
    expose:
      - '5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Local migration source / emergency fallback. Runtime media uses STORAGE_DRIVER=s3.
      - media_data:/data/media
    expose:
      - '3000'
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Local migration source / emergency fallback. Runtime media uses STORAGE_DRIVER=s3.
      - media_data:/data/media
    networks:
      - internal

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - internal

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
      # [HUMANO] Bind 80/443 on the public interface after firewall + DNS are ready:
      # - '80:80'
      # - '443:443'
    volumes:
      - ./docker/Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin
    networks:
      - internal

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
