name: Verify

on:
  push:
    branches: [main, codex/premium-ux]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: camila_test
          POSTGRES_USER: camila_test
          POSTGRES_PASSWORD: camila_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U camila_test -d camila_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://camila_test:camila_test@127.0.0.1:5433/camila_test
      DATABASE_URL: postgresql://camila_test:camila_test@127.0.0.1:5433/camila_test
      ADMIN_ORIGIN: http://127.0.0.1:5174
      MEDIA_ROOT: ${{ github.workspace }}/var/media

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @camila/admin exec playwright install --with-deps chromium

      - name: Run complete verification
        run: pnpm verify

      - name: Audit production dependencies
        run: pnpm audit --prod
