# Staging overrides for compose.prod.yaml (loopback only; no public DNS).
#
#   docker compose -f compose.prod.yaml -f compose.staging.yaml --env-file .env.staging up -d --build
#
# Or: pnpm production:smoke

services:
  postgres:
    ports:
      - '127.0.0.1:55432:5432'

  migrate:
    env_file:
      - path: .env.staging
        required: true

  api:
    env_file:
      - path: .env.staging
        required: true
    environment:
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_TLS_REJECT_UNAUTHORIZED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    env_file:
      - path: .env.staging
        required: true
    environment:
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_TLS_REJECT_UNAUTHORIZED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  backup:
    env_file:
      - path: .env.staging
        required: true
    environment:
      # Staging drill uses MinIO with a SEPARATE backup bucket + keys from media S3_*.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-http://minio:9000}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-kairo-backups-staging}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      BACKUP_S3_FORCE_PATH_STYLE: 'true'
      BACKUP_S3_PREFIX: postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  caddy:
    ports:
      - '127.0.0.1:18080:80'
      - '127.0.0.1:18443:443'
    environment:
      CAMILA_DOMAIN: ${CAMILA_DOMAIN:-localhost}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
      CADDY_SITE_OPTIONS: ${CADDY_SITE_OPTIONS:-tls internal}

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_staging_data:/data
    expose:
      - '9000'
      - '9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-kairo-backups-staging}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\"; do sleep 1; done;
      mc mb --ignore-existing \"local/$$S3_BUCKET\";
      mc mb --ignore-existing \"local/$$BACKUP_S3_BUCKET\";
      exit 0;
      "
    networks:
      - internal
    restart: 'no'

volumes:
  minio_staging_data:

networks:
  internal:
    # Declared so this override file validates alone; merged with compose.prod.yaml in smoke.
    name: kairo_staging_internal
